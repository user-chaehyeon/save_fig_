<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDL-B 16x16 UPA Interactive Delay-Power Comparison</title>
<style>
:root {
  color-scheme: light;
  --background: light-dark(rgb(255 255 255), rgb(24 24 24));
  --foreground: light-dark(rgb(24 24 24), rgb(244 244 244));
  --muted: light-dark(rgb(92 92 92), rgb(184 184 184));
  --surface: light-dark(rgb(247 247 247), rgb(37 37 37));
  --border: light-dark(rgb(210 210 210), rgb(76 76 76));
  --grid: light-dark(rgb(224 224 224), rgb(62 62 62));
  --full-series: light-dark(rgb(22 92 145), rgb(126 195 245));
  --even-series: light-dark(rgb(188 92 25), rgb(245 158 96));
  --boundary: light-dark(rgb(80 80 80), rgb(186 186 186));
  --font-size: 16px;
  --graph-width: 1800px;
  --graph-height: 920px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-width: 320px;
  color: var(--foreground);
  background: var(--background);
  font-family: "Times New Roman", Times, serif;
  font-size: var(--font-size);
  font-weight: 400;
}

body {
  padding: 16px;
}

main {
  display: grid;
  gap: 14px;
  width: 100%;
}

#cdlb-interactive-root {
  font-size: var(--font-size);
}

h1,
p {
  margin: 0;
}

h1 {
  font-size: 1.45em;
  font-weight: 500;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, minmax(210px, 1fr));
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
}

.control {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 12px;
  align-items: center;
}

.control label {
  font-weight: 500;
}

.control output {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.control input[type="range"] {
  grid-column: 1 / -1;
  width: 100%;
  accent-color: var(--full-series);
}

.summary {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.summary strong {
  color: var(--foreground);
  font-weight: 500;
}

.chart-stage {
  position: relative;
  width: 100%;
  overflow: auto;
  border: 1px solid var(--border);
  background: var(--background);
}

#delay-power-chart {
  display: block;
  width: var(--graph-width);
  height: var(--graph-height);
  min-width: 720px;
  color: var(--foreground);
  background: var(--background);
}

.grid-line {
  stroke: var(--grid);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

.axis-line {
  stroke: var(--foreground);
  stroke-width: 1.2;
  vector-effect: non-scaling-stroke;
}

.tick-text,
.axis-label,
.panel-title,
.legend-text,
.boundary-label {
  fill: var(--foreground);
  font-family: "Times New Roman", Times, serif;
}

.tick-text,
.legend-text,
.boundary-label {
  font-size: 0.88em;
}

.axis-label {
  font-size: 1em;
}

.panel-title {
  font-size: 1.08em;
  font-weight: 500;
}

.series-full {
  fill: none;
  stroke: var(--full-series);
  stroke-width: 2.2;
  vector-effect: non-scaling-stroke;
}

.series-even {
  fill: none;
  stroke: var(--even-series);
  stroke-width: 2.2;
  stroke-dasharray: 8 5;
  vector-effect: non-scaling-stroke;
}

.boundary-line {
  stroke: var(--boundary);
  stroke-width: 1.4;
  stroke-dasharray: 6 5;
  vector-effect: non-scaling-stroke;
}

.crosshair {
  stroke: var(--foreground);
  stroke-width: 1;
  stroke-dasharray: 3 3;
  opacity: 0.72;
  vector-effect: non-scaling-stroke;
}

.hover-full {
  fill: var(--background);
  stroke: var(--full-series);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

.hover-even {
  fill: var(--background);
  stroke: var(--even-series);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

.legend-full,
.legend-even {
  stroke-width: 2.2;
  vector-effect: non-scaling-stroke;
}

.legend-full {
  stroke: var(--full-series);
}

.legend-even {
  stroke: var(--even-series);
  stroke-dasharray: 8 5;
}

.tooltip {
  position: fixed;
  z-index: 10;
  display: none;
  min-width: 260px;
  max-width: min(360px, calc(100vw - 20px));
  padding: 8px 10px;
  border: 1px solid var(--border);
  color: var(--foreground);
  background: var(--surface);
  pointer-events: none;
  font-size: 0.9em;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
}

.tooltip.visible {
  display: block;
}

.context-menu {
  position: fixed;
  z-index: 20;
  min-width: 190px;
  padding: 5px;
  border: 1px solid var(--border);
  color: var(--foreground);
  background: var(--surface);
}

.context-menu[hidden] {
  display: none;
}

.context-menu button {
  width: 100%;
  padding: 7px 10px;
  border: 0;
  color: var(--foreground);
  background: transparent;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.context-menu button:hover,
.context-menu button:focus-visible {
  background: rgb(0 0 0 / 8%);
}

.tooltip-title {
  margin-bottom: 4px;
  font-weight: 500;
}

.tooltip-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
}

.tooltip-row span:last-child {
  text-align: right;
}

.hover-summary {
  min-height: 1.5em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

@media (max-width: 760px) {
  body {
    padding: 10px;
  }

  .controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<main id="cdlb-interactive-root">
  <h1>CDL-B 16x16 UPA Delay-Spatial Linear-Power Comparison</h1>

  <section class="controls" aria-label="Graph display controls">
    <div class="control">
      <label for="font-size-control">Font size</label>
      <output id="font-size-value" for="font-size-control">16 px</output>
      <input id="font-size-control" type="range" min="11" max="30" step="1" value="16">
    </div>
    <div class="control">
      <label for="graph-width-control">Graph width</label>
      <output id="graph-width-value" for="graph-width-control">1800 px</output>
      <input id="graph-width-control" type="range" min="720" max="2600" step="20" value="1800">
    </div>
    <div class="control">
      <label for="graph-height-control">Graph height</label>
      <output id="graph-height-value" for="graph-height-control">920 px</output>
      <input id="graph-height-control" type="range" min="560" max="1500" step="20" value="920">
    </div>
  </section>

  <div class="summary" aria-label="Power comparison summary">
    <span>Full first 32: <strong id="summary-full-first"></strong></span>
    <span>Full last 32: <strong id="summary-full-last"></strong></span>
    <span>Horizontal-column zero-fill first 32: <strong id="summary-even-first"></strong></span>
    <span>Horizontal-column zero-fill last 32: <strong id="summary-even-last"></strong></span>
    <span>Horizontal-column zero-fill total / full total: <strong id="summary-total-ratio"></strong></span>
  </div>

  <section class="chart-stage" id="chart-stage">
    <svg id="delay-power-chart" role="img" aria-labelledby="chart-title chart-description">
      <title id="chart-title">Full UPA and horizontal-column zero-fill delay-bin linear-power comparison</title>
      <desc id="chart-description">Two aligned plots show per-bin linear power and cumulative retained power for 288 delay bins. Hovering shows exact values for both antenna configurations.</desc>
    </svg>
    <div class="tooltip" id="chart-tooltip" role="tooltip" aria-hidden="true"></div>
    <div class="context-menu" id="chart-context-menu" role="menu" hidden>
      <button id="save-chart-png" type="button" role="menuitem">
        Save graph as PNG
      </button>
    </div>
  </section>

  <output class="hover-summary" id="hover-summary" aria-live="polite">
    Move the pointer over the graph to inspect a delay bin.
  </output>
</main>

    [
      ["Full per-bin power", formatPercent(fullPower)],
      ["Horizontal-column zero-fill per-bin power", formatPercent(evenPower)],
      ["Full cumulative power", formatPercent(fullCum)],
      ["Horizontal-column zero-fill cumulative power", formatPercent(evenCum)]
    ].forEach(([label, value]) => {
      const row = document.createElement("div");
      row.className = "tooltip-row";
      const labelSpan = document.createElement("span");
      const valueSpan = document.createElement("span");
      labelSpan.textContent = label;
      valueSpan.textContent = value;
      row.append(labelSpan, valueSpan);
      tooltip.appendChild(row);
    });

    tooltip.classList.add("visible");
    tooltip.setAttribute("aria-hidden", "false");
    const gap = 14;
    const viewportWidth = document.documentElement.clientWidth;
    const viewportHeight = document.documentElement.clientHeight;
    let left = event.clientX + gap;
    let top = event.clientY + gap;
    if (left + tooltip.offsetWidth > viewportWidth - 6) {
      left = event.clientX - tooltip.offsetWidth - gap;
    }
    if (top + tooltip.offsetHeight > viewportHeight - 6) {
      top = event.clientY - tooltip.offsetHeight - gap;
    }
    tooltip.style.left = `${Math.max(6, left)}px`;
    tooltip.style.top = `${Math.max(6, top)}px`;

    hoverSummary.textContent = [
      `Delay bin ${bin}`,
      `full per-bin ${formatPercent(fullPower)}`,
      `horizontal-column zero-fill per-bin ${formatPercent(evenPower)}`,
      `full cumulative ${formatPercent(fullCum)}`,
      `horizontal-column zero-fill cumulative ${formatPercent(evenCum)}`
    ].join(" · ");
  };

  const hideContextMenu = () => {
    contextMenu.hidden = true;
  };

  const cloneSvgWithInlineStyles = (width, height) => {
    const clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", svgNamespace);
    clone.setAttribute("width", String(width));
    clone.setAttribute("height", String(height));
    clone.setAttribute("viewBox", `0 0 ${width} ${height}`);

    const sourceNodes = [svg, ...svg.querySelectorAll("*")];
    const cloneNodes = [clone, ...clone.querySelectorAll("*")];
    const styleProperties = [
      "fill",
      "stroke",
      "stroke-width",
      "stroke-dasharray",
      "stroke-linecap",
      "stroke-linejoin",
      "opacity",
      "font-family",
      "font-size",
      "font-weight",
      "text-anchor",
      "dominant-baseline",
      "vector-effect"
    ];

    sourceNodes.forEach((sourceNode, index) => {
      const targetNode = cloneNodes[index];
      if (!targetNode) {
        return;
      }
      const computedStyle = getComputedStyle(sourceNode);
      styleProperties.forEach(property => {
        const value = computedStyle.getPropertyValue(property);
        if (value) {
          targetNode.style.setProperty(property, value);
        }
      });
    });

    const background = document.createElementNS(svgNamespace, "rect");
    background.setAttribute("x", "0");
    background.setAttribute("y", "0");
    background.setAttribute("width", String(width));
    background.setAttribute("height", String(height));
    background.setAttribute("fill", "#ffffff");
    clone.insertBefore(background, clone.firstChild);
    return clone;
  };

  const exportChartAsPng = async () => {
    hideHover();
    const width = Number(widthControl.value);
    const height = Number(heightControl.value);
    const exportSvg = cloneSvgWithInlineStyles(width, height);
    const serializedSvg = new XMLSerializer().serializeToString(exportSvg);
    const svgBlob = new Blob([serializedSvg], {
      type: "image/svg+xml;charset=utf-8"
    });
    const svgUrl = URL.createObjectURL(svgBlob);

    try {
      const image = new Image();
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error("PNG export image could not be rendered."));
        image.src = svgUrl;
      });

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      if (!context) {
        throw new Error("Canvas is unavailable.");
      }
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);
      context.drawImage(image, 0, 0, width, height);

      const pngBlob = await new Promise(resolve => {
        canvas.toBlob(resolve, "image/png");
      });
      if (!pngBlob) {
        throw new Error("PNG export failed.");
      }

      const pngUrl = URL.createObjectURL(pngBlob);
      try {
        const link = document.createElement("a");
        link.href = pngUrl;
        link.download = "cdlb-upa16x16-delay-power-comparison.png";
        document.body.appendChild(link);
        link.click();
        link.remove();
      } finally {
        URL.revokeObjectURL(pngUrl);
      }
    } finally {
      URL.revokeObjectURL(svgUrl);
    }
  };

  const render = () => {
    const fontSize = Number(fontControl.value);
    const width = Number(widthControl.value);
    const height = Number(heightControl.value);
    root.style.setProperty("--font-size", `${fontSize}px`);
    root.style.setProperty("--graph-width", `${width}px`);
    root.style.setProperty("--graph-height", `${height}px`);
    fontValue.textContent = `${fontSize} px`;
    widthValue.textContent = `${width} px`;
    heightValue.textContent = `${height} px`;

    hideHover();
    hideContextMenu();
    svg.replaceChildren();
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("width", String(width));
    svg.setAttribute("height", String(height));

    const margins = {
      left: Math.max(82, fontSize * 5.4),
      right: Math.max(30, fontSize * 2),
      top: Math.max(52, fontSize * 3.2),
      bottom: Math.max(62, fontSize * 3.8),
      gap: Math.max(78, fontSize * 4.7)
    };
    const usableHeight = height - margins.top - margins.bottom - margins.gap;
    const panelHeight = Math.max(150, usableHeight / 2);
    const panelLeft = margins.left;
    const panelRight = width - margins.right;
    const panels = {
      top: {
        left: panelLeft,
        right: panelRight,
        top: margins.top,
        bottom: margins.top + panelHeight
      },
      bottom: {
        left: panelLeft,
        right: panelRight,
        top: margins.top + panelHeight + margins.gap,
        bottom: margins.top + 2 * panelHeight + margins.gap
      }
    };

    const xMin = data.delayBins[0];
    const xMax = data.delayBins[data.delayBins.length - 1];
    const xScale = value =>
      panels.top.left + (value - xMin) / Math.max(xMax - xMin, 1) * (panels.top.right - panels.top.left);
    const topRawMax = 100 * Math.max(...data.fullPowerRatio, ...data.evenPowerRatio);
    const topYMax = Math.ceil((topRawMax * 1.08) / 5) * 5;
    const yTopScale = value =>
      panels.top.bottom - value / Math.max(topYMax, Number.EPSILON) * (panels.top.bottom - panels.top.top);
    const yBottomScale = value =>
      panels.bottom.bottom - value / 100 * (panels.bottom.bottom - panels.bottom.top);

    const axesLayer = makeSvg("g");
    svg.appendChild(axesLayer);
    renderAxes(axesLayer, panels.top, topYMax, 6, xScale, yTopScale, false);
    renderAxes(axesLayer, panels.bottom, 100, 5, xScale, yBottomScale, true);

    addText(svg, (panels.top.left + panels.top.right) / 2, margins.top - 22,
      "Per-delay-bin Linear Power", "panel-title");
    addText(svg, (panels.bottom.left + panels.bottom.right) / 2, panels.bottom.top - 22,
      "Cumulative Linear-Power Retention", "panel-title");

    const topYLabel = addText(svg, fontSize * 1.15,
      (panels.top.top + panels.top.bottom) / 2,
      "Per-bin Power / Own Total Power (%)", "axis-label");
    topYLabel.setAttribute("transform",
      `rotate(-90 ${fontSize * 1.15} ${(panels.top.top + panels.top.bottom) / 2})`);
    const bottomYLabel = addText(svg, fontSize * 1.15,
      (panels.bottom.top + panels.bottom.bottom) / 2,
      "Cumulative Retained Power (%)", "axis-label");
    bottomYLabel.setAttribute("transform",
      `rotate(-90 ${fontSize * 1.15} ${(panels.bottom.top + panels.bottom.bottom) / 2})`);
    addText(svg, (panels.bottom.left + panels.bottom.right) / 2,
      height - fontSize * 0.65, "Delay Bin Index", "axis-label");

    const boundaryX = xScale(data.delayBins[firstCount - 1]);
    [panels.top, panels.bottom].forEach(panel => {
      svg.appendChild(makeSvg("line", {
        x1: boundaryX,
        x2: boundaryX,
        y1: panel.top,
        y2: panel.bottom,
        class: "boundary-line"
      }));
    });
    addText(svg, boundaryX + 8, panels.top.top + 18, "First 32 bins", "boundary-label", "start");
    addText(svg, boundaryX + 8, panels.bottom.top + 18, "First 32 bins", "boundary-label", "start");

    svg.appendChild(makeSvg("path", {
      d: createPath(data.fullPowerRatio, xScale, yTopScale),
      class: "series-full"
    }));
    svg.appendChild(makeSvg("path", {
      d: createPath(data.evenPowerRatio, xScale, yTopScale),
      class: "series-even"
    }));
    svg.appendChild(makeSvg("path", {
      d: createPath(fullCumulative, xScale, yBottomScale),
      class: "series-full"
    }));
    svg.appendChild(makeSvg("path", {
      d: createPath(evenCumulative, xScale, yBottomScale),
      class: "series-even"
    }));

    renderLegend(svg, panels.top);

    const hoverLayer = makeSvg("g", { "aria-hidden": "true" });
    svg.appendChild(hoverLayer);
    const overlay = makeSvg("rect", {
      x: panels.top.left,
      y: panels.top.top,
      width: panels.top.right - panels.top.left,
      height: panels.bottom.bottom - panels.top.top,
      fill: "transparent",
      "pointer-events": "all"
    });
    overlay.addEventListener("mousemove", event => {
      const rectangle = svg.getBoundingClientRect();
      const localX = (event.clientX - rectangle.left) * width / Math.max(rectangle.width, 1);
      const ratio = (localX - panels.top.left) / Math.max(panels.top.right - panels.top.left, 1);
      const index = Math.max(0, Math.min(
        data.delayBins.length - 1,
        Math.round(ratio * (data.delayBins.length - 1))
      ));
      showHover(event, index);
    });
    overlay.addEventListener("mouseleave", hideHover);
    svg.appendChild(overlay);

    chartState = {
      width,
      xScale,
      yTopScale,
      yBottomScale,
      panels,
      hoverLayer
    };
  };

  [fontControl, widthControl, heightControl].forEach(control => {
    control.addEventListener("input", render);
  });

  svg.addEventListener("contextmenu", event => {
    event.preventDefault();
    hideHover();
    contextMenu.hidden = false;

    const margin = 6;
    let left = event.clientX;
    let top = event.clientY;
    if (left + contextMenu.offsetWidth > window.innerWidth - margin) {
      left = Math.max(margin, window.innerWidth - contextMenu.offsetWidth - margin);
    }
    if (top + contextMenu.offsetHeight > window.innerHeight - margin) {
      top = Math.max(margin, window.innerHeight - contextMenu.offsetHeight - margin);
    }
    contextMenu.style.left = `${left}px`;
    contextMenu.style.top = `${top}px`;
    saveChartPng.focus();
  });

  saveChartPng.addEventListener("click", async () => {
    hideContextMenu();
    try {
      await exportChartAsPng();
      hoverSummary.textContent =
        `Saved cdlb-upa16x16-delay-power-comparison.png (${widthControl.value} × ${heightControl.value} px).`;
    } catch (error) {
      hoverSummary.textContent = error instanceof Error
        ? error.message
        : "PNG export failed.";
    }
  });

  document.addEventListener("click", event => {
    if (!contextMenu.hidden && !contextMenu.contains(event.target)) {
      hideContextMenu();
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      hideContextMenu();
    }
  });

  window.addEventListener("blur", hideContextMenu);

  render();
})();
</script>
</body>
</html>
